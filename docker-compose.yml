version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: profix-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
      MONGO_INITDB_DATABASE: profix-masters
    volumes:
      - mongodb_data:/data/db
    networks:
      - profix-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: profix-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:adminpassword@mongodb:27017/profix-masters?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: 7d
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      DEFAULT_COMMISSION_RATE: 0.15
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - profix-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: profix-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - profix-network

volumes:
  mongodb_data:

networks:
  profix-network:
    driver: bridge
